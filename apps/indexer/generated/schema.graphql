"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSON

scalar BigInt

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type ViewPageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type Meta {
  status: JSON
}

type Query {
  match(id: BigInt!): match
  matchs(
    where: matchFilter
    orderBy: String
    orderDirection: String
    before: String
    after: String
    limit: Int
    offset: Int
  ): matchPage!
  card(tokenId: BigInt!): card
  cards(
    where: cardFilter
    orderBy: String
    orderDirection: String
    before: String
    after: String
    limit: Int
    offset: Int
  ): cardPage!
  pick(matchId: BigInt!, playerId: Float!): pick
  picks(
    where: pickFilter
    orderBy: String
    orderDirection: String
    before: String
    after: String
    limit: Int
    offset: Int
  ): pickPage!
  listing(tokenId: BigInt!): listing
  listings(
    where: listingFilter
    orderBy: String
    orderDirection: String
    before: String
    after: String
    limit: Int
    offset: Int
  ): listingPage!
  sale(id: String!): sale
  sales(
    where: saleFilter
    orderBy: String
    orderDirection: String
    before: String
    after: String
    limit: Int
    offset: Int
  ): salePage!
  wallet(address: String!): wallet
  wallets(
    where: walletFilter
    orderBy: String
    orderDirection: String
    before: String
    after: String
    limit: Int
    offset: Int
  ): walletPage!
  settings(id: String!): settings
  settingss(
    where: settingsFilter
    orderBy: String
    orderDirection: String
    before: String
    after: String
    limit: Int
    offset: Int
  ): settingsPage!
  _meta: Meta
}

